profile:
  id: de
  version: '1.3'
  name: Deutschland – regulatorische Basis
  description: 'Regulatorisches Basisprofil für die Prüfung von Studiengängen in Deutschland. Dieses Profil enthält
    bundesweite bzw. übergreifende Regel- und Referenzquellen. Landesrecht und hochschulspezifische Regelungen werden
    ausschließlich über zusätzliche Profile eingebunden.

    '
  jurisdiction:
    country_code: DE
    country_name: Deutschland
  language:
    default: de
  regulatory_levels:
  - id: supranational
    name: Europäischer / überstaatlicher Rahmen
    description: 'Übergreifende europäische Qualitäts- und Qualifikationsrahmen. Diese Quellen wirken grundsätzlich
      rahmensetzend und sind nicht automatisch detailrechtliche Prüfmaßstäbe.

      '
  - id: interstate
    name: Länderübergreifende / staatsvertragliche Ebene
    description: 'Länderübergreifende Regelungen und Vereinbarungen, die für das deutsche Akkreditierungs- und Studiensystem
      maßgeblich sein können.

      '
  - id: kmk
    name: KMK / länderübergreifende Beschlussebene
    description: 'Beschlüsse, Strukturvorgaben, Qualifikationsrahmen und sonstige länderübergreifende Referenzrahmen
      der Kultusministerkonferenz.

      '
  - id: accreditation_council
    name: Akkreditierungsrat
    description: 'Beschlüsse, Auslegungen und sonstige akkreditierungsbezogene Regelungen bzw. Interpretationshilfen
      des Akkreditierungsrates.

      '
  precedence:
    description: Dieses Profil definiert bewusst keine vollständige Rangfolge zwischen allen übergreifenden Quellen.
      Konflikte werden anhand von rechtlichem Status, expliziter Ablösung, zeitlicher Geltung, Scope und den aktiven
      Landes- und Institutionsprofilen aufgelöst.
    strategy:
    - explicit_supersession
    - applicable_binding_law_and_regulation
    - scope_specificity_within_same_regulatory_level
    - temporal_validity
    - interpretative_and_supplementary_sources_only_for_interpretation
    - unresolved_conflicts_remain_unclear
    no_total_order: true
  programme_types:
  - bachelor
  - master
  - state_examination
  - other
  subject_areas:
  - programme_structure
  - modularisation
  - workload_and_credits
  - examinations
  - study_achievements
  - qualification_objectives
  - learning_outcomes
  - quality_assurance
  - admission
  - language_admission
  - practical_components
  - teacher_education
  - joint_programmes
  - recognition
  - graduation
  - documentation
  - accreditation
  sources:
  - id: accreditation_treaty
    title: Studienakkreditierungsstaatsvertrag
    regulatory_level: interstate
    source_type: treaty
    status: binding_framework
    effective_from: '2018-01-01'
    current_as_of: '2026-10-06'
    scope:
      jurisdiction:
        country: DE
      subject_area:
      - accreditation
      - quality_assurance
      - programme_structure
    knowledge_file: knowledge/accreditation/studienakkreditierungsstaatsvertrag.pdf
    note: Rechtlicher Rahmen des Akkreditierungssystems. Die konkreten materiellen Kriterien werden durch die Landesrechtsverordnungen
      ausgefüllt.
  - id: mrvo_2024
    title: Musterrechtsverordnung gemäß Art. 4 Abs. 1–4 Studienakkreditierungsstaatsvertrag
    regulatory_level: interstate
    source_type: model_regulation
    status: supplementary
    current_as_of: '2026-10-06'
    scope:
      jurisdiction:
        country: DE
      subject_area:
      - accreditation
      - programme_structure
      - modularisation
      - workload_and_credits
      - qualification_objectives
      - learning_outcomes
      - quality_assurance
      - graduation
      - joint_programmes
      - teacher_education
    knowledge_file: knowledge/accreditation/mrvo-2024.pdf
    note: Aktuelles gemeinsames Muster. Rechtsverbindlich sind die jeweiligen Landesrechtsverordnungen; daher nicht
      allein als unmittelbare Mangelgrundlage verwenden.
  - id: hqr
    title: Qualifikationsrahmen für deutsche Hochschulabschlüsse
