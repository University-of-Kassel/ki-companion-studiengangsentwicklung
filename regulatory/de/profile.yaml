  last_source_audit: '2026-10-06'
  source_audit_rules:
    current_law_first: Für aktuelle Akkreditierungsprüfungen haben Staatsvertrag und die geltende Landesrechtsverordnung
      Vorrang vor Legacy-Beschlüssen des alten Akkreditierungsrechts.
    legacy_sources: Quellen mit legacy_use=true oder status=inactive werden nur bei historischer Prüfung oder ausdrücklich
      einschlägigem Altverfahren aktiviert.
    model_regulation: Die MRVO ist ein gemeinsames Muster; unmittelbare Rechtsverbindlichkeit entsteht durch die
      jeweilige Landesrechtsverordnung.
    interpretative_sources: Interpretative Quellen dürfen den aktuellen verbindlichen Normtext erläutern, aber keine
