  scope_guards:
  - id: DE_SCOPE_001_teacher_education
    rule: Lehrerbildungsbezogene Quellen dürfen nur aktiviert werden, wenn programme_features das Merkmal teacher_education
      enthält.
  - id: DE_SCOPE_002_joint_programmes
    rule: Joint-Programme-spezifische Quellen dürfen nur aktiviert werden, wenn programme_features ein einschlägiges
      Joint-/Double-/Multiple-Degree-Merkmal enthält.
  - id: DE_SCOPE_003_language_admission
    rule: Sprachzugangsbezogene Quellen dürfen nicht zur Bewertung sachfremder Regelungsbereiche herangezogen werden.
  - id: DE_SCOPE_004_state_specific
    rule: Landesspezifische Strukturvorgaben dürfen nur zusammen mit einem aktiven Landesprofil und nur für dessen
      einschlägige Teile verwendet werden.
