      preferred: "Fachbereich"
      avoid:
        - "Fakultät"

    - concept: "university_leadership"
      preferred: "Präsidium"
      avoid:
        - "Rektorat"

    - concept: "central_administration_unit"
      preferred: "Abteilung"
      avoid:
        - "Dezernat"

  special_units:
